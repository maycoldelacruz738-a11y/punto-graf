                <p class="descripcion">
                    ¿Quieres comunicarte con nosotros?
                </p>


                
<form id="contact-form">

    <input
        type="text"
        id="nombre"
        name="nombre"
        placeholder="Nombre"
        required>

    <input
        type="email"
        id="email"
        name="email"
        placeholder="Correo electrónico"
        required>

    <input
        type="text"
        id="asunto"
        name="asunto"
        placeholder="Asunto"
        required>

    <textarea
        id="mensaje"
        name="mensaje"
        placeholder="Escribe tu mensaje"
        rows="5"
        required></textarea>

    <button
        type="submit"
        id="submit-btn"
        class="boton">
        Enviar Mensaje
    </button>

    <p id="status-message" aria-live="polite"></p>

</form>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
    const SHEET_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyUaetvXF40dlFWqCVGp8hjx_HlPY8s69rZSiWz01-ys9EMwsSFpqubPmHFOMU_xvSMLA/exec";

    emailjs.init({
        publicKey: "mMGnJJLfH1Yl60ftQ"
    });

    const form = document.getElementById("contact-form");
    const statusMessage = document.getElementById("status-message");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        submitBtn.disabled = true;
        submitBtn.textContent = "Enviando...";
        statusMessage.style.color = "#f39c12";
        statusMessage.textContent = "Enviando tu mensaje...";

        const formData = {
            nombre: document.getElementById("nombre").value,
            email: document.getElementById("email").value,
            asunto: document.getElementById("asunto").value,
            mensaje: document.getElementById("mensaje").value
        };

        try {
            await fetch(SHEET_WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "text/plain;charset=UTF-8"
                },
                body: JSON.stringify(formData)
            });

            await emailjs.sendForm(
                "service_sarh5zj",
                "template_igdlxnb",
                form
            );

            statusMessage.style.color = "#2ecc71";
            statusMessage.textContent =
                "¡Mensaje enviado correctamente! Gracias por contactarnos.";

            form.reset();

        } catch (error) {
            console.error("Error al enviar:", error);

            statusMessage.style.color = "#e74c3c";
            statusMessage.textContent =
                "No se pudo enviar el mensaje. Inténtalo nuevamente.";
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Enviar Mensaje";
        }
    });
</script>
